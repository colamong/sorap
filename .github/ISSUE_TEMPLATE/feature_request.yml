name: Feature request
description: Suggest an idea for Sorap
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: How would you like Sorap to handle it?
    validations:
      required: false
