name: Bug report
description: Report something that doesn't work in Sorap
labels: [bug]
body:
  - type: input
    attributes:
      label: macOS version
      placeholder: e.g. 15.5
    validations:
      required: true
  - type: input
    attributes:
      label: Sorap version
      description: See the About window.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Sorap with ⇧⌘C
        2. …
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior
      description: Screenshots or a screen recording help a lot.
    validations:
      required: true
